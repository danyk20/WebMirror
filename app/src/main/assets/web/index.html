<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>WebMirror</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="player">
<canvas id="screen" width="16" height="16"></canvas>
<div id="notice" hidden></div>
<div id="bar" hidden>
  <button id="ctlToggle" type="button" class="off"><span id="ctlLabel">Control off</span></button>
  <button id="soundBtn" type="button" class="off" hidden><span id="soundLabel">Tap for sound</span></button>
  <div id="ctlNote" hidden></div>
  <div id="fingers" hidden></div>
  <button id="menuBtn" type="button" aria-label="Menu">&#9776;</button>
</div>
<div id="pair" hidden>
  <div id="pairBox">
    <div id="pairMsg">Enter the PIN shown in the WebMirror app on the phone</div>
    <div id="pairPin" aria-live="polite"></div>
    <div id="pairPad">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" data-k="del" aria-label="Delete">&#9003;</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" id="pairOk">OK</button>
    </div>
  </div>
</div>
<div id="message">Connecting&hellip;</div>
<div id="overlay" hidden>
  <div class="row">
    <span id="status">Connecting&hellip;</span>
    <button id="close" type="button" aria-label="Close">&times;</button>
  </div>
  <div id="stats"></div>
  <div class="row delay">
    <button id="delayMinus" type="button" aria-label="Less delay">&minus;</button>
    <input id="delay" type="range" min="0" max="1500" step="10" value="0">
    <button id="delayPlus" type="button" aria-label="More delay">+</button>
    <span id="delayValue">0 ms</span>
  </div>
  <div id="hint" hidden>Adjust delay until lips match sound.</div>
  <div class="row">
    <button id="fullscreen" type="button">Fullscreen</button>
    <a href="/probe.html">Probe page</a>
  </div>
</div>
<script src="player.js"></script>
</body>
</html>
