name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug

      # Android Lint for both store flavors; errors fail the build (warnings are only reported).
      - name: Lint
        run: ./gradlew lintGithubDebug lintPlayDebug

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Web page tests
        run: |
          for f in app/src/test/js/*.test.js; do
            echo "== $f"
            node "$f"
          done
