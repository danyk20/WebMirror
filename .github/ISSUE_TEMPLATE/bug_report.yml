name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check the in-app Help page (Troubleshooting) and existing issues first.
        For security problems, do not use this form. See the security policy.
  - type: input
    id: phone
    attributes:
      label: Phone model
      placeholder: Samsung Galaxy S22
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: Android 16
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: WebMirror version
      description: Settings > About & safety. Say if it is the GitHub or the Google Play version.
      placeholder: 0.1.0 (GitHub)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or car
      description: The device that shows the mirror.
      placeholder: Tesla Model 3, software 2026.x / Chrome 130 on Mac
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on the hotspot
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: Screenshots, or the text from Settings > Debugging. Remove anything private such as tokens.
